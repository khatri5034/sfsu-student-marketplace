<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace Search</title>
  </head>
  <body>
    <main class="page">
      <h1>Search Items</h1>
      <form class="topbar" id="searchForm">
        <input id="searchInput" type="text" placeholder="Search items..." />
        <button type="submit">Search</button>
      </form>

      <p class="meta" id="searchMeta">Enter a query to search items.</p>
      <section class="items" id="itemsContainer"></section>
    </main>
    <script src="/js/search.js"></script>
  </body>
  </html>
